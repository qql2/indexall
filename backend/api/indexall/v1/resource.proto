syntax = "proto3";

package indexall.v1;

import "google/api/annotations.proto";

option go_package = "github.com/construct/indexall/internal/gen/pb/indexall/v1;indexallv1";

// ResourceStatus defines the state of a resource
enum ResourceStatus {
  RESOURCE_STATUS_UNSPECIFIED = 0;
  RESOURCE_STATUS_ACTIVE = 1;
  RESOURCE_STATUS_STALE = 2;
  RESOURCE_STATUS_DELETED = 3;
}

// ResourceTag represents a tag associated with a resource
message ResourceTag {
  string id = 1;
  string name = 2;
  optional string color = 3;
}

// Resource represents an indexed resource from external systems
message Resource {
  string id = 1;
  string source = 2;
  optional string external_id = 3;
  string title = 4;
  optional string description = 5;
  optional string url = 6;
  optional string open_with = 7;
  ResourceStatus status = 8;
  string created_at = 9;
  string updated_at = 10;
  repeated ResourceTag tags = 11;
}

message CreateResourceRequest {
  optional string url = 1;
  string title = 2;
  optional string description = 3;
  optional string source = 4;
  optional string external_id = 5;
  optional string open_with = 6;
  repeated string tag_ids = 7;
}

message CreateResourceResponse {
  string id = 1;
  string title = 2;
  optional string url = 3;
  string source = 4;
  repeated ResourceTag tags = 5;
  string created_at = 6;
}

message UpdateResourceRequest {
  string id = 1;
  optional string title = 2;
  optional string description = 3;
  optional string url = 4;
  optional string open_with = 5;
  optional string external_id = 6; // Used by filesystem connector when file is moved/renamed
}

message GetByExternalIdRequest {
  string source = 1;
  string external_id = 2;
}

message GetByExternalIdResponse {
  optional string id = 1;
  optional string title = 2;
}

message UpdateResourceResponse {
  bool success = 1;
}

message DeleteResourceRequest {
  string id = 1;
}

message DeleteResourceResponse {
  bool success = 1;
}

message GetResourceRequest {
  string id = 1;
}

message GetResourceResponse {
  string id = 1;
  string source = 2;
  optional string external_id = 3;
  string title = 4;
  optional string description = 5;
  optional string url = 6;
  optional string open_with = 7;
  optional string metadata = 8;
  ResourceStatus status = 9;
  optional string synced_at = 10;
  string created_at = 11;
  string updated_at = 12;
  repeated ResourceTag tags = 13;
}

message ListResourcesRequest {
  optional string tag_id = 1;
  optional ResourceStatus status = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListResourcesResponse {
  repeated ResourceListItem items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ResourceListItem {
  string id = 1;
  string source = 2;
  string title = 3;
  optional string description = 4;
  optional string url = 5;
  ResourceStatus status = 6;
  string created_at = 7;
  repeated ResourceTag tags = 8;
}

message SearchResourcesRequest {
  string query = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message SearchResourcesResponse {
  repeated ResourceSearchResult items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

enum MatchSource {
  MATCH_SOURCE_UNSPECIFIED = 0;
  MATCH_SOURCE_TITLE = 1;
  MATCH_SOURCE_DESCRIPTION = 2;
  MATCH_SOURCE_TAG = 3;
  MATCH_SOURCE_ALIAS = 4;
}

message ResourceSearchResult {
  string id = 1;
  string source = 2;
  string title = 3;
  optional string description = 4;
  optional string url = 5;
  string created_at = 6;
  string updated_at = 7;
  repeated TagInfo tags = 8;
  MatchSource match_source = 9;
}

message GetByUrlRequest {
  string url = 1;
}

message GetByUrlResponse {
  message Resource {
    string id = 1;
    string title = 2;
    repeated ResourceTag tags = 3;
  }
  optional Resource resource = 1;
}

message TagInfo {
  string id = 1;
  string name = 2;
  optional string description = 3;
  repeated string aliases = 4;
}

message TagQuery {
  string tag_id = 1;

  enum TagScope {
    DIRECT = 0;
    WITH_ANCESTORS = 1;
    WITH_DESCENDANTS = 2;
  }
  TagScope tag_scope = 2;
}

message KeywordQuery {
  string keyword = 1;

  enum FieldScope {
    ALL = 0;
    TITLE = 1;
    DESCRIPTION = 2;
  }
  FieldScope field_scope = 2;

  enum TagScope {
    DIRECT = 0;
    WITH_ANCESTORS = 1;
    WITH_DESCENDANTS = 2;
  }
  TagScope tag_scope = 3;
}

message ResourceQueryRequest {
  oneof query {
    TagQuery tag_query = 1;
    KeywordQuery keyword_query = 2;
  }

  int32 page = 3;
  int32 page_size = 4;
  string sort_by = 5;
}

message ResourceQueryResponse {
  repeated ResourceSearchResult items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message AddTagRequest {
  string resource_id = 1;
  string tag_id = 2;
}

message AddTagResponse {
  bool success = 1;
}

message RemoveTagRequest {
  string resource_id = 1;
  string tag_id = 2;
}

message RemoveTagResponse {
  bool success = 1;
}

service ResourceService {
  rpc Create(CreateResourceRequest) returns (CreateResourceResponse) {
    option (google.api.http) = {
      post: "/v1/resources"
      body: "*"
    };
  };
  rpc Update(UpdateResourceRequest) returns (UpdateResourceResponse) {
    option (google.api.http) = {
      patch: "/v1/resources/{id}"
      body: "*"
    };
  };
  rpc Delete(DeleteResourceRequest) returns (DeleteResourceResponse) {
    option (google.api.http) = {
      delete: "/v1/resources/{id}"
    };
  };
  rpc Get(GetResourceRequest) returns (GetResourceResponse) {
    option (google.api.http) = {
      get: "/v1/resources/{id}"
    };
  };
  rpc Query(ResourceQueryRequest) returns (ResourceQueryResponse) {
    option (google.api.http) = {
      post: "/v1/resources/query"
      body: "*"
    };
  };
  rpc GetByUrl(GetByUrlRequest) returns (GetByUrlResponse) {
    option (google.api.http) = {
      get: "/v1/resources/by-url"
    };
  };
  rpc GetByExternalId(GetByExternalIdRequest) returns (GetByExternalIdResponse) {
    option (google.api.http) = {
      get: "/v1/resources/by-external-id"
    };
  };
  rpc AddTag(AddTagRequest) returns (AddTagResponse) {
    option (google.api.http) = {
      post: "/v1/resources/{resource_id}/tags"
      body: "*"
    };
  };
  rpc RemoveTag(RemoveTagRequest) returns (RemoveTagResponse) {
    option (google.api.http) = {
      delete: "/v1/resources/{resource_id}/tags/{tag_id}"
    };
  };
}
