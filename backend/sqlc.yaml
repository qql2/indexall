version: "2"

sql:
  - schema: "migrations"
    queries: "queries"
    engine: "sqlite"
    gen:
      go:
        out: "internal/db/gen"
        package: "gen"
        emit_json_tags: true
        emit_db_tags: true
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
