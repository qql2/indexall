syntax = "proto3";

package indexall.v1;

option go_package = "github.com/construct/indexall/internal/gen/pb/indexall/v1;indexallv1";

// Tag represents a label/classification for resources
message Tag {
  string id = 1;
  string name = 2;
  optional string color = 3;
  repeated string aliases = 4;
  repeated string parent_ids = 5;
  int32 resource_count = 6;
  string created_at = 7;
  string updated_at = 8;
}

message CreateTagRequest {
  string name = 1;
  optional string color = 2;
  repeated string aliases = 3;
  repeated string parent_ids = 4;
}

message CreateTagResponse {
  string id = 1;
  string name = 2;
  optional string color = 3;
  repeated string aliases = 4;
  repeated string parent_ids = 5;
  string created_at = 6;
}

message UpdateTagRequest {
  string id = 1;
  optional string name = 2;
  optional string color = 3;
}

message UpdateTagResponse {
  bool success = 1;
}

message DeleteTagRequest {
  string id = 1;
}

message DeleteTagResponse {
  bool success = 1;
}

message ListTagsRequest {}

message ListTagsResponse {
  repeated TagListItem tags = 1;
}

message TagListItem {
  string id = 1;
  string name = 2;
  optional string color = 3;
  repeated string aliases = 4;
  repeated string parent_ids = 5;
  int32 resource_count = 6;
}

message TagTreeNode {
  string id = 1;
  string name = 2;
  optional string color = 3;
  int32 resource_count = 4;
  repeated TagTreeNode children = 5;
}

message GetTreeRequest {}

message GetTreeResponse {
  repeated TagTreeNode roots = 1;
}

message SearchTagsRequest {
  string query = 1;
}

message SearchTagsResponse {
  repeated TagSearchResult results = 1;
}

message TagSearchResult {
  string id = 1;
  string name = 2;
  optional string color = 3;
  optional string matched_alias = 4;
}

message AddAliasRequest {
  string tag_id = 1;
  string alias = 2;
}

message AddAliasResponse {
  string id = 1;
  string alias = 2;
}

message RemoveAliasRequest {
  string alias_id = 1;
}

message RemoveAliasResponse {
  bool success = 1;
}

message AddParentRequest {
  string child_id = 1;
  string parent_id = 2;
}

message AddParentResponse {
  bool success = 1;
}

message RemoveParentRequest {
  string child_id = 1;
  string parent_id = 2;
}

message RemoveParentResponse {
  bool success = 1;
}

service TagService {
  rpc Create(CreateTagRequest) returns (CreateTagResponse);
  rpc Update(UpdateTagRequest) returns (UpdateTagResponse);
  rpc Delete(DeleteTagRequest) returns (DeleteTagResponse);
  rpc List(ListTagsRequest) returns (ListTagsResponse);
  rpc GetTree(GetTreeRequest) returns (GetTreeResponse);
  rpc Search(SearchTagsRequest) returns (SearchTagsResponse);
  rpc AddAlias(AddAliasRequest) returns (AddAliasResponse);
  rpc RemoveAlias(RemoveAliasRequest) returns (RemoveAliasResponse);
  rpc AddParent(AddParentRequest) returns (AddParentResponse);
  rpc RemoveParent(RemoveParentRequest) returns (RemoveParentResponse);
}
