version: v1

plugins:
  # Go code generation
  - name: go
    out: ../internal/gen/pb
    opt:
      - paths=source_relative

  # ConnectRPC Go server generation
  - name: connect-go
    out: ../internal/gen/pb
    opt:
      - paths=source_relative

  # TypeScript code generation for web frontend
  - name: es
    out: ../../packages/web/src/gen
    opt:
      - target=ts

  # ConnectRPC TypeScript client generation for web frontend
  - name: connect-es
    out: ../../packages/web/src/gen
    opt:
      - target=ts
